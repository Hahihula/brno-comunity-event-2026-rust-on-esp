<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rust on ESP — choose language / vyberte jazyk</title>
<link rel="icon" type="image/svg+xml" href="assets/espressif-mark.svg">
<style>
  :root { --red:#e8362d; --surface:#141416; --border:#2a2a2e; --text:#f2f2f3; --dim:#a1a1a8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #000; color: var(--text);
    font-family: "Inter","Helvetica Neue",Helvetica,"Segoe UI",Roboto,system-ui,sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2rem;
    padding: 2rem; text-align: center;
  }
  img.logo { height: 40px; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.6rem); letter-spacing: -0.02em; }
  h1 span { color: var(--red); }
  p { margin: 0; color: var(--dim); }
  .langs { display: flex; gap: 1.6rem; flex-wrap: wrap; justify-content: center; }
  a.lang {
    display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
    padding: 1.6rem 2.2rem; min-width: 14rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); text-decoration: none; font-size: 1.2rem; font-weight: 600;
    transition: border-color .15s, transform .15s;
  }
  a.lang:hover, a.lang:focus-visible { border-color: var(--red); transform: translateY(-3px); outline: none; }
  a.lang svg { width: 120px; height: 80px; border-radius: 6px; border: 1px solid var(--border); }
  a.lang small { font-weight: 400; color: var(--dim); font-size: 0.85rem; }
</style>
</head>
<body>
  <img class="logo" src="assets/espressif-logo-on-black.svg" alt="Espressif">
  <h1><span>Rust</span> on ESP</h1>
  <p>Choose your language · Vyberte jazyk</p>
  <div class="langs">
    <a class="lang" href="en.html" hreflang="en">
      <svg viewBox="0 0 60 30" aria-hidden="true">
        <clipPath id="t"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath>
        <path d="M0,0v30h60v-30z" fill="#012169"/>
        <path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/>
        <path d="M0,0 60,30M60,0 0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/>
        <path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/>
        <path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/>
      </svg>
      English <small>Presentation in English</small>
    </a>
    <a class="lang" href="cs.html" hreflang="cs">
      <svg viewBox="0 0 3 2" aria-hidden="true">
        <rect width="3" height="1" fill="#fff"/>
        <rect y="1" width="3" height="1" fill="#D7141A"/>
        <path d="M0,0 1.5,1 0,2z" fill="#11457E"/>
      </svg>
      Čeština <small>Prezentace v češtině</small>
    </a>
  </div>
</body>
</html>
